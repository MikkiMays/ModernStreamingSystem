<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="860" height="400" rx="12" fill="#ffffff"/>
  <text x="28" y="40" font-size="19" font-weight="700" fill="#111827">Режим «по IP» — без домена</text>
  <text x="28" y="64" font-size="13.5" fill="#6b7280">setup.sh --ip-only · сертификат самоподписанный, с IP внутри</text>

  <rect x="28" y="96" width="168" height="170" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="112" y="122" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Участники</text>
  <text x="112" y="150" font-size="12.5" fill="#374151" text-anchor="middle">Браузер</text>
  <text x="112" y="172" font-size="12.5" fill="#374151" text-anchor="middle">Cord для Windows</text>
  <text x="112" y="206" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">https://203.0.113.10</text>
  <text x="112" y="232" font-size="11" fill="#b45309" text-anchor="middle">один раз принять</text>
  <text x="112" y="248" font-size="11" fill="#b45309" text-anchor="middle">предупреждение</text>

  <line x1="196" y1="180" x2="430" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#c)"/>
  <text x="313" y="170" font-size="11.5" fill="#6b7280" text-anchor="middle">DNS не нужен</text>

  <rect x="436" y="96" width="396" height="230" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="634" y="122" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Ваш сервер · 203.0.113.10</text>

  <rect x="456" y="140" width="356" height="50" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="472" y="161" font-size="12.5" font-weight="600" fill="#1e3a8a">TCP 443 — edge (TLS, самоподписанный)</text>
  <text x="472" y="180" font-size="11.5" fill="#1e40af">сайт, API, чат, файлы и сигналинг /rtc</text>

  <rect x="456" y="200" width="356" height="50" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="472" y="221" font-size="12.5" font-weight="600" fill="#14532d">UDP 7882 — медиа WebRTC</text>
  <text x="472" y="240" font-size="11.5" fill="#166534">звук, камера и демонстрация экрана</text>

  <rect x="456" y="260" width="356" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="472" y="281" font-size="12.5" font-weight="600" fill="#78350f">TCP 5349 + UDP 3478 — TURN</text>
  <text x="472" y="300" font-size="11.5" fill="#92400e">порт 80 не нужен: сертификат не выпускается</text>

  <rect x="28" y="290" width="804" height="86" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="48" y="315" font-size="13" font-weight="700" fill="#991b1b">Почему не просто http://203.0.113.10</text>
  <text x="48" y="338" font-size="12.5" fill="#7f1d1d">Камера, микрофон и демонстрация экрана работают только в защищённом контексте (secure context).</text>
  <text x="48" y="358" font-size="12.5" fill="#7f1d1d">По обычному http браузер и WebView2 не дадут доступ к устройствам. Исключение — только localhost.</text>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
