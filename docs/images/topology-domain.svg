<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="860" height="430" rx="12" fill="#ffffff"/>
  <text x="28" y="40" font-size="19" font-weight="700" fill="#111827">Режим «домен» — одно DNS-имя</text>
  <text x="28" y="64" font-size="13.5" fill="#6b7280">setup.sh --domain meet.example.com · сертификат выпускает Let's Encrypt автоматически</text>

  <!-- Users -->
  <rect x="28" y="96" width="168" height="196" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="112" y="122" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Участники</text>
  <text x="112" y="150" font-size="12.5" fill="#374151" text-anchor="middle">Браузер</text>
  <text x="112" y="172" font-size="12.5" fill="#374151" text-anchor="middle">Cord для Windows</text>
  <text x="112" y="194" font-size="12.5" fill="#374151" text-anchor="middle">Телефон</text>
  <text x="112" y="232" font-size="11.5" fill="#6b7280" text-anchor="middle">вписывают один адрес</text>
  <text x="112" y="252" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">https://meet.example.com</text>

  <!-- DNS -->
  <rect x="236" y="96" width="150" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="311" y="122" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">DNS</text>
  <text x="311" y="146" font-size="12" fill="#1e40af" text-anchor="middle">meet.example.com</text>
  <text x="311" y="166" font-size="12" fill="#1e40af" text-anchor="middle">A → 203.0.113.10</text>
  <text x="311" y="184" font-size="10.5" fill="#6b7280" text-anchor="middle">без прокси, «DNS only»</text>

  <!-- Arrows -->
  <line x1="196" y1="150" x2="232" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="196" y1="250" x2="430" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- Server -->
  <rect x="436" y="96" width="396" height="290" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="634" y="122" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Ваш сервер · 203.0.113.10</text>

  <rect x="456" y="140" width="356" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="472" y="162" font-size="12.5" font-weight="600" fill="#1e3a8a">TCP 443 — edge (TLS)</text>
  <text x="472" y="181" font-size="11.5" fill="#1e40af">сайт, API, чат, файлы и сигналинг /rtc — всё на одном имени</text>

  <rect x="456" y="202" width="356" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="472" y="224" font-size="12.5" font-weight="600" fill="#14532d">UDP 7882 — медиа WebRTC</text>
  <text x="472" y="243" font-size="11.5" fill="#166534">звук, камера и демонстрация экрана идут здесь</text>

  <rect x="456" y="264" width="356" height="52" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="472" y="286" font-size="12.5" font-weight="600" fill="#78350f">TCP 5349 + UDP 3478 — TURN</text>
  <text x="472" y="305" font-size="11.5" fill="#92400e">запасной путь, если прямой UDP закрыт у участника</text>

  <rect x="456" y="326" width="356" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="472" y="345" font-size="12" font-weight="600" fill="#374151">TCP 80 — только выпуск сертификата</text>
  <text x="472" y="361" font-size="11" fill="#6b7280">закрывать нельзя: без него Let's Encrypt не продлит</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
