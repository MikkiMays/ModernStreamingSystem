# LiveKit читает весь WebRTC через один UDP-сокет (rtc.udp_port 7882). Ядро режет буфер приёма
# сокета по net.core.rmem_max, а умолчание (~7.5 МБ здесь) меньше того, что SFU запрашивает, —
# под нагрузкой сокет переполняется и теряет пакеты (RcvbufErrors, виден в нагрузочном тесте
# 29.10.2026). Поднимаем потолок до рекомендованных LiveKit 16 МБ; backlog NIC — с дефолтных 1000.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 8192
