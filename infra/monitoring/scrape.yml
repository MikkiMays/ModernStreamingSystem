# Что собирает VictoriaMetrics профиля `monitoring` (E10-B, docs/observability.md §5).
#
# Все цели — на 127.0.0.1 этой машины: контейнеры Cord работают в сети хоста и наружу метрик не
# публикуют. Исключение одно — LiveKit: его порт метрик слушает тот же 0.0.0.0, что и сигналинг, поэтому
# он закрыт паролем (`LIVEKIT_METRICS_PASSWORD` из .env, `scripts/configure.mjs`). `%{…}` VictoriaMetrics
# подставляет из своего окружения — пароль не лежит в git.
#
# Раз в 30 с: этого хватает для графиков и алертов «не отвечает пять минут» и вдвое дешевле 15 с.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

# Метка `machine` — у каждой цели (R208): `a` — эта машина (стенд разработки и пульт), удалённые — из
# `infra/generated/scrape-nodes/fleet-*.json` (fra — продукт cord.online, msk, hel). Дашборды делят по ней dev и прод.
scrape_configs:
  # Ядро: встречи, люди, входы, отказы, блоки (cord_*), JVM, HTTP, пул базы.
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['127.0.0.1:8080'], labels: { machine: a, kind: local } }]

  # SFU: комнаты, участники (боты считаются — людей говорит ядро), пакеты, потери.
  - job_name: livekit
    static_configs: [{ targets: ['127.0.0.1:6789'], labels: { machine: a, kind: local } }]
    basic_auth:
      username: metrics
      password: '%{LIVEKIT_METRICS_PASSWORD}'

  # Шлюз Caddy: запросы, статусы, задержки (`metrics` в infra/Caddyfile).
  - job_name: gateway
    static_configs: [{ targets: ['127.0.0.1:2019'], labels: { machine: a, kind: local } }]

  # Загрузки файлов.
  - job_name: tusd
    static_configs: [{ targets: ['127.0.0.1:1080'], labels: { machine: a, kind: local } }]

  # Службы: музыка, Telegram-бот.
  - job_name: services
    static_configs: [{ targets: ['127.0.0.1:18100'], labels: { machine: a, kind: local } }]

  # Куратор: синтетический звонок через SFU раз в минуту (`cord-publisher --probe`, W1b).
  - job_name: probe
    static_configs: [{ targets: ['127.0.0.1:9402'], labels: { machine: a, kind: local } }]

  # Контейнеры этой машины (cAdvisor из infra/fleet/install-agents.sh --containers-only, только loopback). Нет агента —
  # цель просто `down`, экран «Флот — live» пишет, что строк по контейнерам нет.
  - job_name: cadvisor
    static_configs: [{ targets: ['127.0.0.1:19101'], labels: { machine: a, kind: local } }]

  # Машина: ЦП (и steal — главный признак замирания хоста), память, диск, сеть; textfile-метрики хоста
  # (`cord_host_soft_lockups_total` из `infra/host/soft-lockups.sh`).
  - job_name: node
    static_configs: [{ targets: ['127.0.0.1:9100'], labels: { machine: a, kind: local } }]

  - job_name: postgres
    static_configs: [{ targets: ['127.0.0.1:9187'], labels: { machine: a, kind: local } }]

  - job_name: redis
    static_configs: [{ targets: ['127.0.0.1:9121'], labels: { machine: a, kind: local } }]

  # Проверки «как видно снаружи»: главная по внешнему имени, срок сертификата.
  - job_name: gatus
    static_configs: [{ targets: ['127.0.0.1:8084'], labels: { machine: a, kind: local } }]

  # Сам мониторинг — чтобы видеть его цену на графике «Сервер».
  - job_name: victoriametrics
    static_configs: [{ targets: ['127.0.0.1:8428'], labels: { machine: a, kind: local } }]
  - job_name: vmalert
    static_configs: [{ targets: ['127.0.0.1:8880'], labels: { machine: a, kind: local } }]
  - job_name: alertmanager
    static_configs: [{ targets: ['127.0.0.1:9093'], labels: { machine: a, kind: local } }]

  # Медиаузлы (R195): SFU, машина, шлюз-лайт и куратор каждого узла — через магистраль на локальных портах
  # узла управления (`infra/generated/scrape-nodes/<узел>.json`, метки `node` и `role`). Пароль метрик SFU —
  # общий на все узлы; остальные цели пароля не имеют, но и снаружи не видны.
  - job_name: nodes
    file_sd_configs: [{ files: ['/etc/vm/nodes/*.json'] }]
    basic_auth:
      username: metrics
      password: '%{LIVEKIT_METRICS_PASSWORD}'

  # SFU машин продукта (R208, R209): через туннели пульта (`infra/fleet/tunnels.sh`, цель 3 → 6789), со своим паролем —
  # паролем метрик LiveKit продукта, не стенда. `job` переименовывается в `nodes`: «Флот — live» узнаёт удалённую
  # машину по нему, а вид — по `kind=livekit`.
  - job_name: nodes-sfu
    file_sd_configs: [{ files: ['/etc/vm/sfu/*.json'] }]
    basic_auth:
      username: metrics
      password: '%{PRODUCT_LIVEKIT_METRICS_PASSWORD}'
    relabel_configs: [{ target_label: job, replacement: nodes }]
