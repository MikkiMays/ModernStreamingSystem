# Алерты владельцу (vmalert → Alertmanager → Telegram), docs/observability.md §8.
#
# УРОК vm-host-stalls. Хост замирает на 20–55 с. Мониторинг не должен на каждое замирание кричать
# «всё упало» и молчать об отбое:
# - «не отвечает» — только если не отвечало все пять минут и ещё пять подряд (`max_over_time … for: 5m`);
# - замирание — отдельный алерт HostStalled; пока он горит, Alertmanager гасит его следствия — отказы во
#   входе и 5xx шлюза (inhibit в infra/generated/alertmanager.yml); «не отвечает» не гасится: оно ждёт 10 мин;
# - отбой приходит всегда (`send_resolved`).
#
# Метки severity: page — сломано то, чем пользуются люди; warn — скоро сломается; info — знать.
groups:
  - name: cord
    interval: 30s
    rules:
      # Вечно горящий алерт: Alertmanager раз в минуту пингует им внешнего сторожа (HEALTHCHECKS_URL).
      # Пингов нет — машина или мониторинг мертвы, и об этом скажет сторож, а не они сами.
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations: { summary: 'Мониторинг Cord жив' }

      - alert: HostStalled
        expr: avg by (machine) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.3
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: '{{ $labels.machine }}: хост тормозит — ЦП отнимает гипервизор (steal {{ $value | humanizePercentage }}). Звонки могут замирать'

      - alert: CoreDown
        expr: max_over_time(up{job="core"}[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Ядро Cord не отвечает десять минут: встречи не создаются и не открываются' }

      - alert: SfuDown
        expr: max_over_time(up{job="livekit"}[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'SFU (LiveKit) не отвечает десять минут: звук и видео не идут' }

      - alert: GatewayDown
        expr: max_over_time(up{job="gateway"}[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Шлюз Cord не отвечает десять минут: сайт недоступен' }

      - alert: ServicesDown
        expr: max_over_time(up{job="services"}[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Службы Cord (музыка, кинозал, бот) не отвечают десять минут' }

      - alert: PostgresDown
        expr: max_over_time(pg_up[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'PostgreSQL не отвечает десять минут' }

      - alert: RedisDown
        expr: max_over_time(redis_up[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Redis не отвечает десять минут: входы и пределы не работают' }

      - alert: SiteUnreachable
        expr: max_over_time(gatus_results_endpoint_success[5m]) == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Проверка «{{ $labels.name }}» не проходит десять минут' }

      - alert: CertificateExpiresSoon
        expr: min by (name) (gatus_results_certificate_expiration_seconds) < 14 * 86400
        for: 1h
        labels: { severity: warn }
        annotations: { summary: 'Сертификат «{{ $labels.name }}» истекает меньше чем через 14 дней' }

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 15m
        labels: { severity: warn }
        annotations: { summary: '{{ $labels.machine }}: на диске свободно меньше 15 %' }

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warn }
        annotations: { summary: '{{ $labels.machine }}: свободной памяти меньше 10 % десять минут' }

      # Доля неудачных входов во встречу — при живом трафике, а не на двух попытках ночью.
      # Дверь `media` (`ice_failed`, R149) — не отказ ядра, а сеть человека после пропущенного входа:
      # тот же вход уже сосчитан своей дверью с `ok`, и в долю отказов он не идёт.
      - alert: JoinFailures
        expr: |
          sum(rate(cord_joins_total{door!="media",result!="ok"}[10m])) / sum(rate(cord_joins_total{door!="media"}[10m])) > 0.2
          and sum(rate(cord_joins_total{door!="media"}[10m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'Больше 20 % входов во встречи отказаны за десять минут' }

      - alert: GatewayErrors5xx
        expr: |
          sum(rate(caddy_http_requests_total{code=~"5.."}[5m])) / sum(rate(caddy_http_requests_total[5m])) > 0.05
          and sum(rate(caddy_http_requests_total[5m])) > 0.1
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'Больше 5 % ответов шлюза — ошибки 5xx' }

      # Пределы частоты считают в памяти ядра: Redis не отвечает (R106). Вход открыт, но пределы
      # у каждого процесса ядра свои и с нуля — дольше пяти минут так жить не стоит.
      - alert: RateLimiterFallback
        expr: sum(increase(cord_rate_limiter_fallback_total[5m])) > 0
        for: 5m
        labels: { severity: warn }
        annotations: { summary: 'Redis не отвечает пределам частоты пять минут: счёт в памяти ядра, вход открыт' }

      # Куратор (W1b, R10): синтетический звонок через SFU на самой машине раз в минуту. Сети между его
      # участниками нет — потери и оборот здесь делает хост или SFU, и у людей будет не лучше. Три
      # пробы подряд (окно 3 мин при пробе раз в минуту), чтобы одно замирание не кричало.
      - alert: ProbeLoss
        expr: |
          min_over_time(cord_probe_loss_ratio{leg="down"}[3m]) > 0.02
          or min_over_time(cord_probe_rtt_ms[3m]) > 150
        labels: { severity: warn }
        annotations: { summary: 'Куратор: потери или оборот через SFU выше порога три пробы подряд — хост или SFU не справляются' }

      - alert: ProbeFailing
        expr: |
          increase(cord_probe_runs_total{result="ok"}[10m]) == 0
          and increase(cord_probe_runs_total{result="error"}[10m]) > 0
        labels: { severity: warn }
        annotations: { summary: 'Куратор десять минут не может войти в SFU или не слышит себя' }

      # Сторож издателя музыки: тишина вместо музыки при живом треке (декодер не успевает — хост,
      # источник), в секундах. Полминуты за десять минут — это уже слышно всем в комнате.
      - alert: MusicStarving
        expr: sum(increase(cord_music_starved_seconds_total[10m])) > 30
        labels: { severity: warn }
        annotations: { summary: 'Музыка молчала больше 30 с за десять минут при живых треках' }

      # Дренаж перед выкаткой (`deploy.sh --drain`) включает обслуживание; забытый флаг держит сервер
      # без новых встреч. Перезапуск ядра его сбрасывает, так что полчаса — это уже не выкатка.
      - alert: MaintenanceOn
        expr: max(cord_maintenance) == 1
        for: 30m
        labels: { severity: info }
        annotations: { summary: 'Обслуживание включено дольше 30 минут: новые встречи не создаются' }

      # Окно технических работ (R194, `backlog/bin/maintenance.sh`): забытое закроется само, но к тому
      # времени продукт может стоять часами. Два часа — уже не обычное обновление.
      - alert: MaintenanceWindowLong
        expr: max(cord_maintenance_window) == 1
        for: 2h
        labels: { severity: warn }
        annotations: { summary: 'Технические работы идут дольше двух часов: Cord закрыт для всех' }

      # Замирания хоста по журналу ядра Linux (`infra/host/soft-lockups.sh`, R10) — чтобы сравнивать
      # до/после смены тарифа; само замирание ловит HostStalled по steal.
      - alert: HostSoftLockups
        expr: increase(cord_host_soft_lockups_total[1h]) > 0
        labels: { severity: info }
        annotations: { summary: 'Хост замирал (soft lockup) за последний час: {{ $value }} раз' }

      - alert: AutoBlock
        expr: increase(cord_blocks_created_total{by="auto"}[15m]) > 0
        labels: { severity: info }
        annotations: { summary: 'Сервер сам закрыл адрес за частые отказы. Проверить и снять — страница «Активность»' }

      - alert: ShieldOn
        expr: increase(cord_errors_total{code="CODE_INVALID"}[5m]) > 1000
        labels: { severity: info }
        annotations: { summary: 'Перебор кодов встреч: включён «щит», вход по коду идёт через ведущего' }

  # ── Медиаузлы (R195, docs/architecture/distributed-media.md) ────────────────────────────────────
  - name: cord-nodes
    interval: 30s
    rules:
      # Ядро признало узел мёртвым по двум признакам (R200 §5, Р-105: промахи опроса раз в 2 с и жалобы
      # половины его людей, ≈ 4–8 с): его встречи уже переехали; алерт — о том, что узла нет и ёмкость
      # меньше. Две минуты, чтобы перезапуск контейнера узла не кричал.
      - alert: NodeDown
        expr: cord_node_up == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'Медиаузел {{ $labels.node }} мёртв: встречи с него переехали, новых на него нет' }

      # Узел молчит по магистрали, а его люди на связи и не жалуются: это магистраль (backbone, 7443, фильтр A)
      # или зависший хост, не отказ SFU. Встречи не трогаются, новых на узел нет. Минута — замирания хоста
      # на 2–4 с и перезапуск backbone не кричат.
      - alert: NodeUnreachable
        expr: cord_node_up == 1 and cord_node_reachable == 0
        for: 1m
        labels: { severity: warn }
        annotations: { summary: 'Медиаузел {{ $labels.node }} не отвечает ядру по магистрали, но его встречи живы: новых на него нет, идущие не трогаются' }

      # Магистраль до узла: VictoriaMetrics не видит SFU узла через туннель, хотя ядро видит (или нет) —
      # либо backbone на A/узле упал, либо 7443 закрыт.
      - alert: NodeScrapeDown
        # Метка цели — `kind="livekit"` (её ставят и туннели, и агент машины), а не `role`: у `role` значения
        # `media` и `product+media`, и прежнее условие `role="livekit"` не совпадало ни с одной целью (12.11.2026).
        expr: max_over_time(up{job="nodes",kind="livekit"}[5m]) == 0
        for: 5m
        labels: { severity: warn }
        annotations: { summary: 'Метрики SFU машины {{ $labels.machine }} не собираются десять минут: связь с машиной или сам SFU' }

      # Реестр узлов есть, но его узел управления — не NODE_ID этого сервера: ядро его игнорирует и живёт одним
      # узлом (прод не падает), а файл или .env — поправить.
      - alert: NodeRegistryIgnored
        expr: cord_node_registry_ignored == 1
        for: 5m
        labels: { severity: warn }
        annotations: { summary: 'Реестр медиаузлов проигнорирован: control в registry.json ≠ NODE_ID в .env — узлы не работают, встречи идут на одном узле' }

      # Узел на ступени 4 минуту (R200, server-selection.md §3.4): новые встречи на него не ставятся,
      # идущие не трогаются — SFU сам снижает слои картинки. Ведущий видит «мест нет» в настройках.
      # Р-135: встреча идёт на ближайший узел с запасом (ЦП, канал, память, память SFU, диск); перегретый узел новых
      # встреч не берёт — они уходят на соседний. Пределов по числу встреч нет.
      - alert: NodeHot
        expr: cord_node_hot == 1
        for: 5m
        labels: { severity: warn }
        annotations: { summary: 'Медиаузел {{ $labels.node }} перегружен 5 минут: новые встречи идут на соседние узлы' }

      - alert: NodesSaturated
        expr: cord_nodes_saturated == 1
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'Все медиаузлы перегружены: встречи создаются без запаса — нужна ёмкость (новый узел)' }

      - alert: MeetingsPlacedWithoutHeadroom
        expr: sum(increase(cord_node_choice_total{reason=~".*-saturated"}[10m])) > 0
        labels: { severity: info }
        annotations: { summary: 'За 10 минут встречи ставились на узлы без запаса: {{ $value }}' }

      # Остался один живой узел — не авария, но резерва для переезда нет.
      - alert: NodeSingle
        expr: count(cord_node_up == 1) == 1 and count(cord_node_up) > 1
        for: 10m
        labels: { severity: info }
        annotations: { summary: 'Жив только один медиаузел: отказ ещё одного оставит встречи без узла' }

      # Хост узла: steal гипервизора — звонки на нём будут замирать (как HostStalled у A).
      - alert: NodeHostStalled
        expr: avg by (node) (rate(node_cpu_seconds_total{job="nodes",mode="steal"}[5m])) > 0.3
        for: 10m
        labels: { severity: warn }
        annotations: { summary: 'Хост узла {{ $labels.node }} тормозит: steal {{ $value | humanizePercentage }}' }

  # Флот (R208): рабочие машины через туннели пульта (метка machine: fra — продукт cordcam.ru, msk, hel). Правила
  # машины выше (HostStalled, DiskAlmostFull, MemoryLow) уже по каждой машине; здесь — то, чего у стенда нет.
  - name: cord-fleet
    interval: 30s
    rules:
      - alert: ProductCoreDown
        expr: max_over_time(up{machine="fra", kind="core"}[3m]) == 0
        labels: { severity: page }
        annotations: { summary: 'Ядро продукта cordcam.ru не отвечает пульту три минуты (через туннель)' }

      - alert: FleetMachineUnreachable
        expr: max_over_time(up{job="nodes", kind="node"}[5m]) == 0
        labels: { severity: warn }
        annotations:
          summary: '{{ $labels.machine }}: машина не отвечает пульту пять минут — туннель или сама машина (systemctl status cord-fleet-tunnel@{{ $labels.machine }})'

      - alert: FleetAgentDown
        expr: max_over_time(up{job="nodes", kind=~"containers|gateway"}[10m]) == 0
        labels: { severity: info }
        annotations: { summary: '{{ $labels.machine }}: агент {{ $labels.kind }} не отвечает десять минут (infra/fleet/install-agents.sh)' }

      - alert: FleetCpuSaturated
        expr: (1 - avg by (machine) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 10m
        labels: { severity: warn }
        annotations: { summary: '{{ $labels.machine }}: ЦП занят больше 85 % десять минут — новые встречи лучше ставить на другие узлы' }

      - alert: FleetUplinkHigh
        expr: sum by (machine) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) * 8 > 600e6
        for: 10m
        labels: { severity: warn }
        annotations: { summary: '{{ $labels.machine }}: исходящий канал больше 600 Мбит/с десять минут' }

  # Р-134: содержимое (чат, файлы, доска и её картинки, очереди кинозала и музыки) — не дольше 24 ч от добавления.
  - name: cord-retention
    interval: 60s
    rules:
      - alert: ContentRetentionBreached
        expr: max by (kind) (cord_retention_oldest_content_seconds) > 25 * 3600
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'Содержимое старше 25 ч ({{ $labels.kind }}): почасовая чистка не справляется (Р-134)' }

      - alert: RetentionSweepStalled
        expr: time() - max by (job) (cord_retention_last_sweep_timestamp_seconds) > 2 * 3600
        for: 10m
        labels: { severity: warn }
        annotations: { summary: 'Чистка содержимого не проходила больше двух часов ({{ $labels.job }})' }

