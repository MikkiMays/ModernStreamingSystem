# Прокси кинозала только для YouTube (R196): серверу Cord там, где YouTube режут (Россия), — выход через свой узел за рубежом.
# Пускает ровно домены YouTube, только с паролем. Снаружи недоступен: только через зашифрованный туннель stunnel (`install.sh`) —
# в обычном HTTP-прокси имя `googlevideo.com` из TLS идёт открытым, и DPI на пути резал бы его так же, как прямой запрос.
http_port 127.0.0.1:3128
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm cord-youtube
auth_param basic credentialsttl 1 hour
acl authed proxy_auth REQUIRED
acl youtube dstdomain .youtube.com .youtu.be .googlevideo.com .ytimg.com .ggpht.com .youtube-nocookie.com .googleusercontent.com
acl ssl_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !ssl_ports
http_access deny !youtube
http_access allow authed
http_access deny all
# Только туннель: ничего не кэшировать, о себе и клиенте не говорить, адресов в журнал не писать.
cache deny all
via off
forwarded_for delete
access_log none
cache_log /dev/null
logfile_rotate 0
shutdown_lifetime 3 seconds
