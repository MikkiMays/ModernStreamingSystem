<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Фикстура: тысяча плейлистов</title>
  </head>
  <body>
    <script>
      // Страница, которая спрашивает сотни «плейлистов»: разных и один и тот же много раз — и читает их,
      // как плеер.
      const read = (url) => fetch(url).then((response) => response.text()).catch(() => null);
      for (let i = 0; i < 120; i++) read('/many/' + i + '.m3u8');
      for (let i = 0; i < 60; i++) read('/many/same.m3u8?again');
    </script>
  </body>
</html>
