spring:
  application:
    name: modern-streaming-system
  threads.virtual.enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/streaming}
    username: ${DATABASE_USER:streaming}
    password: ${DATABASE_PASSWORD}
    hikari.maximum-pool-size: 12
  data.redis:
    host: ${REDIS_HOST:localhost}
    password: ${REDIS_PASSWORD:}
    # Команда — полсекунды, подключение — секунда (по умолчанию у Lettuce 10 с): дольше ждать
    # счётчик частоты незачем, на время сбоя он считает в памяти ядра (R106, `RateLimits`).
    timeout: 500ms
    connect-timeout: 1s
  jackson.deserialization.fail-on-null-for-primitives: false
server:
  port: 8080
  error.include-message: never
  forward-headers-strategy: none
  tomcat.max-http-form-post-size: 16KB
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.show-details: never
springdoc:
  api-docs.path: /api/openapi
stream:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  livekit-url: ${LIVEKIT_URL:ws://localhost:7880}
  livekit-internal-url: ${LIVEKIT_INTERNAL_URL:http://localhost:7880}
  tusd-internal-url: ${TUSD_INTERNAL_URL:http://127.0.0.1:1080}
  livekit-key: ${LIVEKIT_API_KEY}
  livekit-secret: ${LIVEKIT_API_SECRET}
  session-secret: ${SESSION_SECRET}
  internal-secret: ${INTERNAL_SECRET}
  files-root: ${FILES_ROOT:./.local/uploads}
  access-password: ${ACCESS_PASSWORD:}
  # Пароль владельца сервера: страница «Активность» (`/activity`) — встречи, журнал, блокировки и
  # рычаги. Пусто — страница выключена. Это не пароль входа на сервер (`ACCESS_PASSWORD`).
  admin-password: ${ADMIN_PASSWORD:}
  server-name: ${SERVER_NAME:Cord}
  redis-enabled: true
  # Сколько людей во встрече (T06). Боты — музыка — места не занимают; SFU пускает на четыре
  # подключения больше (`scripts/configure.mjs`), чтобы им и переходным сессиям хватало места.
  max-participants: ${STREAM_MAX_PARTICIPANTS:20}
  max-screens: 2
  # Сколько встреч сервер держит одновременно. Считается встреча, где хотя бы один человек на
  # связи, или совсем новая — моложе 30 секунд. Восемь обычных встреч по 5–6 человек, а не восемь
  # полных (`docs/architecture/target-2026-10.md` §5.2); уточняется замером на спокойной машине.
  max-rooms: ${STREAM_MAX_ROOMS:8}
  # Отдача канала сервера, Мбит/с — доля канала в ступени загрузки рядом с пингом (R143, Р-37).
  uplink-mbps: ${STREAM_UPLINK_MBPS:1000}
  recovery-seconds: 20
  join-seconds: 120
  empty-room-seconds: 60
  unused-room-seconds: 300
  # Сроки хранения — словами. Понимаются `7 days`, `2 weeks`, `3 months`, `month`, `90m`,
  # `never` и `immediately`; окончание `s` необязательно, `m` — это минуты, а месяц — `mo`
  # или `month`. Разбор и единицы — в `config/Term.java`.
  retention:
    # Сохранённая в избранное встреча ждёт возвращения неделю. Отсчёт — от последнего входа
    # человека: пока в неё заходят, она живёт сколько угодно долго.
    saved-room: ${SAVED_ROOM_RETENTION:7 days}
    # Встречу, которую никто себе не сохранил, держать не для кого: она уходит вместе с
    # разговором. Поставьте `1 hour`, если нужно окно на «я случайно вышел».
    unsaved-room: ${UNSAVED_ROOM_RETENTION:immediately}
    # Сколько после завершения хранится переписка и события встречи.
    closed-history: ${CLOSED_HISTORY_RETENTION:1 hour}
    # Сколько живут сообщения, события, расписки, приглашения и вложения идущей встречи.
    messages: ${MESSAGE_RETENTION:1 day}
    # Журнал аудита: кто что сделал во встрече и на сервере. Трёх месяцев хватает на разбор жалобы.
    # Адрес в нём — только отпечатком (HMAC секретом сервера), сам адрес не хранится нигде.
    audit: ${AUDIT_RETENTION:3 months}
    # Строки встреч для «Активности» за период: длительность, пик, человеко-минуты. Ни названий, ни
    # текста. Год — чтобы сравнивать с прошлым сезоном.
    meeting-stats: ${MEETING_STATS_RETENTION:1 year}
    # Итоги дня — только числа, без людей.
    activity-daily: ${ACTIVITY_DAILY_RETENTION:never}
  upload-timeout-seconds: 3600
  file-max-bytes: 104857600
  room-max-bytes: 1073741824
  total-max-bytes: 10737418240
  event-history-limit: 1000
  admission-open: ${ADMISSION_OPEN:true}
  media:
    # Правила качества видео для всех, кто входит: сервер задаёт, клиент исполняет (П2). Уровень
    # пишется как в плеере — `720p30`, `1080p60`: высота 720/1080/1440, частота 15/30/60
    # (`config/Level.java`). Выбранное публикуется сразу; «Авто» нет.
    quality:
      # С чего начинает каждый, пока не выбрал иначе.
      default: ${QUALITY_DEFAULT:720p30}
      # Выше этого выбрать нельзя — ни по кадру, ни по частоте.
      ceiling: ${QUALITY_CEILING:1080p60}
      # Окно разгона полосы, словами (`config/Term.java`): столько жалобы кодировщика не считаются,
      # и столько отправитель ждёт кадра целевого размера, прежде чем показ откроется зрителям.
      settle: ${QUALITY_SETTLE:4 seconds}
      # Ужимать ли камеру до маленького слоя на время демонстрации экрана. По умолчанию — нет.
      camera-yields-to-screen: ${CAMERA_YIELDS_TO_SCREEN:false}
  favorites:
    # Сколько встреч профиль устройства хранит в избранном — во всех группах вместе (T06, П3).
    # Одиннадцатая не добавляется: ядро отвечает `409 FAVORITES_FULL` с этим числом.
    max-saved: ${FAVORITES_MAX_SAVED:10}
  meeting:
    # У профиля устройства активна одна встреча (T52): вход во вторую спрашивает, выйти ли из первой
    # (`409 ALREADY_IN_MEETING`, повтор с `X-Cord-Leave`). Без профиля правило не действует.
    one-active-per-profile: ${ONE_ACTIVE_MEETING_PER_PROFILE:true}
    # Потолок длительности одной встречи (A2 `docs/abuse-model.md`): страница с ботом музыки или
    # забытая вкладка не держат встречу вечно. За `warn-before` до конца всем приходит
    # предупреждение, затем встреча завершается. `never` — без потолка. Сроки — словами (`Term`).
    max-duration: ${MEETING_MAX_DURATION:24 hours}
    warn-before: ${MEETING_WARN_BEFORE:15 minutes}
    # «Вы ещё здесь?»: кто столько времени не говорил, не трогал мышь и клавиатуру и не включал
    # камеру, видит плашку; без ответа за `presence-answer` — обычный выход. `never` — не спрашивать.
    presence-check: ${MEETING_PRESENCE_CHECK:2 hours}
    presence-answer: ${MEETING_PRESENCE_ANSWER:5 minutes}
    # Кино и музыка гаснут, если столько времени ни один человек не на связи: места заняты, а
    # смотреть и слушать некому.
    idle-integrations: ${MEETING_IDLE_INTEGRATIONS:10 minutes}
    # Сколько человек ждут допуска у двери (A5). Ожидающие мест не занимают: заявки не держат
    # встречу полной, а ведущий впускает, только пока есть место.
    waiting: ${MEETING_WAITING:10}
  chat:
    # Сколько сообщений держит комната. Сверх этого уходят старейшие — кольцо, а не отказ всем.
    room-history: ${CHAT_ROOM_HISTORY:1000}
    # Файлы, которые могут запустить программу (exe, msi, bat, js, apk, архивы…): `warn` — пометка и
    # предупреждение при скачивании, `block` — не принимать (415 FILE_TYPE_BLOCKED), `allow` — как все.
    executable-attachments: ${CHAT_EXECUTABLE_ATTACHMENTS:warn}
  # Доска (R159): пределы сцены Excalidraw одной встречи (`board/BoardProperties.java`). Сцена — в базе
  # (`room_boards`), картинки — там же (`room_board_files`) и уходят вместе со встречей.
  board:
    max-elements: ${BOARD_MAX_ELEMENTS:10000}
    max-scene-bytes: ${BOARD_MAX_SCENE_BYTES:8388608}
    max-element-bytes: 65536
    # Одно сообщение сокета доски: элемент до 64 КиБ и конверт вокруг него.
    max-message-bytes: 98304
    max-files: ${BOARD_MAX_FILES:32}
    max-file-bytes: ${BOARD_MAX_FILE_BYTES:4194304}
    # Как часто сцена с новыми правками пишется в базу, мс.
    flush-ms: 3000
  # Обращения в поддержку (E13): форма на странице «Помощь» и в окне «?». Обращение хранится в базе,
  # бот доносит его в Telegram владельца Cord: `SUPPORT_TELEGRAM_CHAT_ID`, без него — чат оповещений
  # мониторинга (`ALERT_TELEGRAM_CHAT_ID`, E10); нет обоих — обращения только в базе.
  support:
    enabled: ${SUPPORT_ENABLED:true}
    notify-telegram-chat: ${SUPPORT_TELEGRAM_CHAT_ID:${ALERT_TELEGRAM_CHAT_ID:}}
    # С одного адреса и со всех вместе — словами, как пределы антибота.
    per-ip: ${SUPPORT_PER_IP:5 per hour}
    per-server: ${SUPPORT_PER_SERVER:60 per hour}
    # В обращении может быть контакт человека — дольше нужного его не держим.
    retention: ${SUPPORT_RETENTION:6 months}
  # Антибот (E11, `docs/abuse-model.md` §4). Пределы — словами: `10 per hour`, `20 per minute`,
  # `2 per 10 minutes`, `off`. Ключ адреса — IPv4 целиком или сеть /64 для IPv6. Числа — для машины
  # на 6 vCPU; пересчитываются по метрикам E10 и замеру ёмкости E05.
  abuse:
    # Невидимая проверка «не бот» на создании встречи и входе по коду: браузер решает задачу
    # proof-of-work (протокол ALTCHA) в фоне, человек её не видит. `off` — выключить.
    human-check: ${HUMAN_CHECK:proof-of-work}
    # Сколько чисел перебирает браузер в худшем случае; в среднем — половину. 50 000 — доли секунды на
    # телефоне. Ключ, выбравший половину своих пределов, и «щит» получают задачу дороже.
    proof-cost: ${PROOF_COST:50000}
    # На адрес — щедрее, чем на профиль: за мобильным и офисным NAT много людей.
    per-ip:
      rooms-created: ${ABUSE_IP_ROOMS_CREATED:10 per hour}
      # Сколько встреч, созданных с адреса, одновременно занимают место на сервере (`max-rooms`).
      open-rooms: ${ABUSE_IP_OPEN_ROOMS:8}
      admissions: ${ABUSE_IP_ADMISSIONS:30 per minute}
      code-joins: ${ABUSE_IP_CODE_JOINS:10 per minute}
      # Промахи кодом встречи. Выбравший предел до конца окна не входит по коду вовсе — даже верным.
      code-misses: ${ABUSE_IP_CODE_MISSES:20 per hour}
      # Открытые сокеты событий с адреса и частота их открытия.
      sockets: ${ABUSE_IP_SOCKETS:30}
      socket-opens: ${ABUSE_IP_SOCKET_OPENS:60 per minute}
      # Неверный пароль сервера; выбравший предел ждёт конца окна.
      password-misses: ${ABUSE_IP_PASSWORD_MISSES:10 per hour}
      # Подключения к SFU через шлюз (`/internal/signaling-auth`).
      signaling: ${ABUSE_IP_SIGNALING:60 per minute}
      # Сколько байт загружает один адрес за срок (`2GB per 1 day`, `off`). Выше пятой части
      # `total-max-bytes` не бывает: один адрес не займёт место всего сервера (A10).
      uploads: ${ABUSE_IP_UPLOADS:2GB per 1 day}
      # Заявки с адреса у двери одной встречи (A5): десяток вкладок не забьёт очередь допуска.
      waiting-per-room: ${ABUSE_IP_WAITING_PER_ROOM:2}
      # Сообщения чата со всех участников адреса вместе (A6). Щедрее предела участника — за NAT офис.
      chat-messages: ${ABUSE_IP_CHAT_MESSAGES:60 per minute}
    per-profile:
      rooms-created: ${ABUSE_PROFILE_ROOMS_CREATED:6 per hour}
      open-rooms: ${ABUSE_PROFILE_OPEN_ROOMS:2}
    per-member:
      chat-messages: ${ABUSE_MEMBER_CHAT_MESSAGES:20 per minute}
      # Одно и то же сообщение подряд — не чаще, чем раз в этот срок.
      chat-repeat: ${ABUSE_MEMBER_CHAT_REPEAT:30 seconds}
      # Сокеты событий одного участника; лишний закрывает самый старый.
      sockets: ${ABUSE_MEMBER_SOCKETS:3}
    server:
      # Промахи кодом по всему серверу. Выше — «щит»: вход по коду идёт через допуск ведущего, а
      # задача «не бот» дорожает в восемь раз, пока счётчик не спадёт.
      code-misses: ${ABUSE_SERVER_CODE_MISSES:300 per minute}
    # Блокировки владельца сервера (страница «Активность»): адрес (IPv6 — сеть /64) или профиль
    # устройства. Блок снимается досрочно там же.
    blocks:
      # Срок блока, если владелец его не выбрал. `never` — навсегда.
      default-term: ${BLOCK_DEFAULT_TERM:1 day}
      # Столько отказов «слишком часто» за окно — и сервер закрывает адрес сам на `auto-block-term`.
      # Считаются только отказы про адрес (частота входов, новых встреч, промахи кода и пароля).
      # `off` — сам не закрывает.
      auto-block: ${AUTO_BLOCK:10 per 10 minutes}
      auto-block-term: ${AUTO_BLOCK_TERM:30 minutes}
