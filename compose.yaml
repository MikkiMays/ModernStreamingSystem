name: modern-streaming

# Потолок на журналы контейнеров.
#
# ЗАЧЕМ. 13.09.2026 сервер встал: диск занят на 100 % из 126 ГБ. Из них 70 ГБ — журнал
# ОДНОГО контейнера этого проекта (`services`), который крутился в ошибке «Too many open
# files» и писал 65 тысяч строк в секунду. За двадцать часов он съел диск целиком — вместе
# с соседней системой на той же машине.
#
# Ограничений не было ни у одной из служб, поэтому журналу и нечего было остановить.
# Двадцать мегабайт на пять файлов — сто мегабайт на службу.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
services:
  edge:
    logging: *default-logging
    image: livekit/caddyl4:v2.11.3@sha256:9dd090159a6042a907dbff0ce9dda27a21d2a559dc7b03b60a8e6b1b60b8348e
    network_mode: host
    command: run --config /etc/edge.json
    restart: unless-stopped
    volumes:
      - ./infra/generated/edge.json:/etc/edge.json:ro
      # ip mode has no ACME: the edge loads the same self-signed certificate the SFU
      # presents for TURN/TLS, so both answer for the bare address with one identity.
      - ./infra/generated/tls:/etc/tls:ro
      - certificates:/data
    depends_on: [gateway]
  gateway:
    logging: *default-logging
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      # Пустой по умолчанию: сборка без него остаётся сборкой, просто без номера коммита.
      args: { CORD_BUILD: '${CORD_BUILD:-}' }
    network_mode: host
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs: [/config, /data, /tmp]
    volumes: [./.local/windows-releases:/releases:ro]
    depends_on:
      core: { condition: service_healthy }
      tusd: { condition: service_started }
  core:
    logging: *default-logging
    build: { context: ., dockerfile: infra/Dockerfile.server }
    network_mode: host
    env_file: .env
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SPRINGDOC_API_DOCS_ENABLED: 'false'
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # Каталог серверов — файл этой установки (`scripts/sign-catalog.mjs sign` → `.local/catalog/servers.jws`),
    # не часть образа: нет файла — `/api/v1/catalog` отвечает 404, клиент остаётся на своём сервере.
    volumes: [uploads:/data/uploads, ./.local/catalog:/catalog:ro]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      volume-init: { condition: service_completed_successfully }
    mem_limit: 2g
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/actuator/health']
      interval: 5s
      timeout: 3s
      # Spring на перегруженной ВМ поднимается до четырнадцати минут (cord.nikg.tech, 19.10.2026):
      # без запаса compose объявлял ядро нездоровым и не запускал шлюз и службы. Запас ничего не
      # стоит: здоровым ядро считается с первой удачной проверки, а не по истечении срока.
      start_period: 900s
      retries: 12
  services:
    logging: *default-logging
    build: { context: ., dockerfile: services/Dockerfile }
    network_mode: host
    env_file:
      - path: .env
      - path: .local/telegram.env
        required: false
    # Плеер страниц кинозала — соседний контейнер `sniffer` на своём порту хоста.
    environment:
      CINEMA_SNIFFER_URL: http://127.0.0.1:18103
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs: [/tmp]
    volumes: [services-data:/data]
    mem_limit: 1g
    pids_limit: 256
    # Each LiveKit room this bot joins gathers ICE candidates on every host
    # interface, so a single music session holds ~100 UDP sockets. The Docker
    # default soft limit of 1024 was reached after nine sessions: uvicorn then
    # spun at 100 % CPU failing accept() with "Too many open files".
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 20s
    depends_on:
      core: { condition: service_healthy }
      volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
  # Плеер страниц кинозала (`services/sniffer`): headless Chromium открывает страницу, которую не понял
  # yt-dlp, и записывает, какой поток спросил её плеер. Страницы чужие, а Chromium здесь без своей
  # песочницы, поэтому контейнер — не в сети хоста и не в общей сети docker, а только в своей подсети
  # (`sniffer` ниже: вне 172.16.0.0/12, которой UFW этой машины доверяет порты соседних служб), и из неё
  # новым соединением нельзя ни в одну частную сеть и ни к самому хосту — это держат правила DOCKER-USER и
  # INPUT (`infra/sniffer-firewall.sh`, единица `cord-sniffer-firewall.service` — раньше docker). Проверив
  # их, скрипт пишет метку в /run/cord-sniffer (сюда — только для чтения): без метки своей подсети и при
  # соседях, до которых можно дотянуться, плеер страниц страниц не открывает. Служба ходит к нему на
  # 127.0.0.1:18103. Секрет установки нужен только затем, чтобы первый процесс (`entry.py`) посчитал из
  # него ключ входа службы и убрал сам секрет из окружения; других переменных из .env у браузера нет.
  # Прокси и частные адреса — те же, что у площадки «По ссылке» в службе: страница и поток выходят в сеть
  # одним путём. `init` не нужен: tini запускает `entry.py` сам, уже без секрета.
  sniffer:
    logging: *default-logging
    build: { context: ., dockerfile: services/sniffer/Dockerfile, target: sniffer }
    networks: [sniffer]
    ports: ['127.0.0.1:18103:8080']
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Run scripts/configure.mjs}
      CINEMA_PROXY: ${CINEMA_PROXY:-}
      CINEMA_PROXY_LINK: ${CINEMA_PROXY_LINK:-}
      CINEMA_PRIVATE_HOSTS_LINK: ${CINEMA_PRIVATE_HOSTS_LINK:-}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes: ['/run/cord-sniffer:/run/cord-sniffer:ro']
    shm_size: 1g
    mem_limit: 1536m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
  postgres:
    logging: *default-logging
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    network_mode: host
    env_file: .env
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/configure.mjs}
    command: postgres -c listen_addresses=127.0.0.1 -c log_statement=none -c log_min_error_statement=panic -c log_parameter_max_length_on_error=0
    volumes: [database:/var/lib/postgresql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U streaming -d streaming']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    logging: *default-logging
    image: redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    network_mode: host
    env_file: .env
    # The host configuration stays root-only. Give Redis its own private runtime copy
    # before the standard image entrypoint drops privileges to the redis user.
    command: [sh, -c, 'cp /etc/redis.conf /tmp/redis.conf && chown redis:redis /tmp/redis.conf && exec docker-entrypoint.sh redis-server /tmp/redis.conf']
    tmpfs: [/tmp]
    volumes: [./infra/generated/redis.conf:/etc/redis.conf:ro]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
  livekit:
    logging: *default-logging
    image: livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    network_mode: host
    command: --config /etc/livekit.json
    # Outside strict mode LiveKit terminates TURN/TLS itself, because it hardcodes the
    # advertised port to 443 whenever TLS is terminated upstream. scripts/turn-cert.mjs
    # keeps this certificate in step with the one Caddy issued.
    volumes:
      - ./infra/generated/livekit.json:/etc/livekit.json:ro
      - ./infra/generated/tls:/etc/tls:ro
    # SFU — первым на процессор (MEDIA-DIAGNOSIS §6, R107): на этой ВМ звонки делят 4 vCPU со сборками,
    # тестами и службами, и когда процессора не хватает, пакеты речи уходят пачкой — у слушателей это
    # обрывы по 150–400 мс. Вес 4096 против 1024 по умолчанию; от ООМ — последним.
    cpu_shares: 4096
    oom_score_adj: -500
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 2m
  volume-init:
    logging: *default-logging
    image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    command: [sh, -c, 'chown 10001:10001 /data/uploads /data/services && chmod 700 /data/uploads /data/services']
    volumes: [uploads:/data/uploads, services-data:/data/services]
    restart: 'no'
  tusd:
    logging: *default-logging
    image: tusproject/tusd:v2.10.0@sha256:9610f0f8edf4cceeb26f1b3ac9fa4bb4803d61a878e222c1573cda63c9e23374
    network_mode: host
    user: '10001:10001'
    command: >-
      -host 127.0.0.1 -port 1080 -base-path /uploads/
      -upload-dir /data/uploads -max-size 104857600 -behind-proxy
      -disable-download -disable-concatenation
      -hooks-http http://127.0.0.1:${HOOKS_PORT:-8090}/internal/tus
      -hooks-http-forward-headers Authorization
      -hooks-enabled-events pre-create,post-finish -hooks-http-retry 5
      -verbose=false -show-startup-logs=false
    volumes: [uploads:/data/uploads]
    restart: unless-stopped
    depends_on:
      volume-init: { condition: service_completed_successfully }
  # ── Профиль `monitoring` (E10-B, docs/observability.md) ─────────────────────────────────────────────
  # Выключен по умолчанию; включает `./setup.sh --monitoring` (или `node scripts/configure.mjs --refresh
  # --monitoring`), который пишет в .env `COMPOSE_PROFILES=monitoring` и пароли. Всё — в сети хоста и
  # только на 127.0.0.1: наружу не смотрит ни один порт, стена sniffer и CSP шлюза не тронуты. Grafana —
  # через SSH-туннель (`ssh -L 3000:127.0.0.1:3000 <сервер>`), не через шлюз. Память — под потолками
  # mem_limit, своя ≈ 410 МиБ в простое (замер E10-A на этой машине).
  victoriametrics:
    profiles: [monitoring]
    logging: *default-logging
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    network_mode: host
    command:
      - -httpListenAddr=127.0.0.1:8428
      - -storageDataPath=/storage
      # Срок хранения: `90d`, `6M`/`6` (месяцы), `1y`. По умолчанию три месяца.
      - -retentionPeriod=${METRICS_RETENTION:-90d}
      - -promscrape.config=/etc/vm/scrape.yml
      - -loggerLevel=WARN
    # Пароль метрик LiveKit подставляется в scrape.yml как %{LIVEKIT_METRICS_PASSWORD}.
    environment:
      LIVEKIT_METRICS_PASSWORD: ${LIVEKIT_METRICS_PASSWORD:-}
    volumes:
      - metrics:/storage
      - ./infra/monitoring/scrape.yml:/etc/vm/scrape.yml:ro
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    # На медленной машине VictoriaMetrics не успевала сбросить ряды на диск за 10 с и умирала по SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
  vmalert:
    profiles: [monitoring]
    logging: *default-logging
    image: victoriametrics/vmalert:v1.154.0@sha256:f11d77f9ff68dfd63c871d0e59ae7b479f9c3fd0e8a685fef690fb88b794d938
    network_mode: host
    command:
      - -httpListenAddr=127.0.0.1:8880
      - -datasource.url=http://127.0.0.1:8428
      - -remoteWrite.url=http://127.0.0.1:8428
      - -remoteRead.url=http://127.0.0.1:8428
      - -notifier.url=http://127.0.0.1:9093
      - -rule=/etc/vmalert/*.yml
      - -evaluationInterval=30s
      - -loggerLevel=WARN
    volumes: [./infra/monitoring/rules:/etc/vmalert:ro]
    read_only: true
    mem_limit: 64m
    restart: unless-stopped
  alertmanager:
    profiles: [monitoring]
    logging: *default-logging
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    network_mode: host
    # Конфигурация с токеном бота лежит только для root (0600, scripts/configure.mjs), поэтому процесс —
    # root без единой привилегии и без записи вне своего тома.
    user: '0:0'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
      - --log.level=warn
    volumes:
      - alerts:/alertmanager
      - ./infra/generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    read_only: true
    mem_limit: 64m
    restart: unless-stopped
  grafana:
    profiles: [monitoring]
    logging: *default-logging
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    network_mode: host
    # Без init при остановке оставался процесс-зомби, и docker не мог остановить контейнер (замер E10-B).
    init: true
    # Без пароля в .env не стартует: иначе вход был бы admin/admin.
    entrypoint: [sh, -c, 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "GRAFANA_PASSWORD пуст: node scripts/configure.mjs --refresh --monitoring" >&2; exit 1; }; exec /run.sh']
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3000'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Ничего не уходит наружу: ни отчётов, ни проверок обновлений, ни новостей, ни плагинов.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cord-meetings.json
      GF_LOG_LEVEL: warn
    volumes:
      - grafana:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    restart: unless-stopped
  node-exporter:
    profiles: [monitoring]
    logging: *default-logging
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes: ['/:/host:ro,rslave']
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped
  postgres-exporter:
    profiles: [monitoring]
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    network_mode: host
    command: [--web.listen-address=127.0.0.1:9187]
    environment:
      DATA_SOURCE_URI: 127.0.0.1:5432/streaming?sslmode=disable
      DATA_SOURCE_USER: streaming
      DATA_SOURCE_PASS: ${DATABASE_PASSWORD:-}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped
  redis-exporter:
    profiles: [monitoring]
    logging: *default-logging
    image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
    network_mode: host
    environment:
      REDIS_ADDR: redis://127.0.0.1:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 127.0.0.1:9121
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped
  gatus:
    profiles: [monitoring]
    logging: *default-logging
    image: twinproduction/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
    network_mode: host
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes: [./infra/monitoring/gatus.yml:/config/config.yaml:ro]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped
volumes:
  database:
  uploads:
  certificates:
  services-data:
  # Профиль `monitoring`: ряды VictoriaMetrics, база Grafana (дашборды — из git), тишины Alertmanager.
  metrics:
  grafana:
  alerts:
networks:
  # Своя сеть плеера страниц: мост с выходом в интернет (подменой адреса хоста), но в подсети, которой
  # стена `infra/sniffer-firewall.sh` запрещает частные сети. Подсеть — та же, что у стены.
  sniffer:
    ipam:
      config:
        - subnet: ${CINEMA_SNIFFER_SUBNET:-10.231.0.0/24}
