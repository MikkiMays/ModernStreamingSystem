<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111419" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cord</title>
    <!--
      Mini App Telegram (E09, T55): отдельный вход, а не маршрут приложения (решение архитектора 13) —
      Telegram Web встраивает его в рамку, а защита по источнику Bot API 10.2 требует одного документа.
      Загрузка та же, что в index.html (сцена марки на CSS 3D до JS), но всегда тёмная: заставка
      BotFather задана цветом `#111419` для обеих тем, и первый кадр страницы совпадает с ней — без
      белой вспышки. Тему Telegram (`themeParams`) применяет уже скрипт (`telegram/theme.ts`). Скрипта
      здесь нет: CSP пускает встроенный стиль, но не встроенный скрипт. Сцену и разметку сверяет с
      index.html `telegram/tg-html.test.ts`. Гасит экран `ui/loader/boot.ts`.
    -->
    <style>
      html,
      body {
        background: #111419;
        overscroll-behavior: none;
      }
      .fl {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 40px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #111419;
        color: #eef0f4;
        contain: strict;
        --fl-accent: #3564f3;
        --fl-delay: 150ms;
      }
      .fl__fade {
        display: grid;
        justify-items: center;
        gap: 36px;
        opacity: 0;
        animation: fl-in 240ms ease-out var(--fl-delay) forwards;
      }
      .fl__stage {
        position: relative;
        width: min(56vw, 220px);
        aspect-ratio: 1;
        perspective: 800px;
      }
      .fl__scene {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        animation: fl-sway 6s ease-in-out infinite alternate;
      }
      .fl__shadow {
        position: absolute;
        inset: auto 14% -8%;
        height: 10%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(0 0 0 / 0.5), transparent);
        animation: fl-breathe 3s ease-in-out infinite alternate;
      }
      .fl-cord__plate {
        position: absolute;
        inset: 20%;
        border-radius: 24%;
        background: var(--fl-accent);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.18);
      }
      .fl-cord__bar {
        position: absolute;
        left: var(--x);
        top: calc(50% - var(--h) / 2);
        width: 7.5%;
        height: var(--h);
        border-radius: 999px;
        background: #fff;
        transform: translateZ(28px) translateY(0) rotate(-15deg);
        animation: fl-bob 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
        animation-delay: calc(var(--i) * -0.4s);
      }
      .fl__brand {
        height: 26px;
        width: auto;
      }
      @keyframes fl-in {
        to {
          opacity: 1;
        }
      }
      @keyframes fl-sway {
        from {
          transform: rotateX(16deg) rotateY(-22deg);
        }
        to {
          transform: rotateX(8deg) rotateY(22deg);
        }
      }
      @keyframes fl-breathe {
        from {
          transform: scaleX(0.86);
          opacity: 0.7;
        }
        to {
          transform: scaleX(1);
          opacity: 1;
        }
      }
      @keyframes fl-bob {
        from {
          transform: translateZ(28px) translateY(6%) rotate(-15deg);
        }
        to {
          transform: translateZ(28px) translateY(-12%) rotate(-15deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fl__scene,
        .fl__scene *,
        .fl__shadow {
          animation: none;
        }
      }
    </style>
  </head>
