<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111419" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cord · Пульт</title>
    <!--
      Пульт флота Cord (R207, Р-119): третий HTML-вход сборки рядом с index.html и tg.html. Шлюз отдаёт его
      только на имени ADMIN_HOST (блок `@admin` в infra/Caddyfile); на имени продукта этого файла нет.
      Сцены загрузки нет: пульт — рабочий инструмент владельца, первый кадр — сразу форма входа.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f6f7fa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111419;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
