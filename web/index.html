<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Cord — видеовстречи, демонстрация экрана и разговор без лишних шагов."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      На домашний экран телефона. iOS читает свои `apple-*`, остальные — манифест; обе
      стороны указывают на одни и те же картинки. Камера и микрофон в standalone работают
      с iOS 13.4 (WebKit #185448), поэтому вынесенный ярлык — полноценный клиент, а не
      витрина. Ссылку из камеры или сообщения iOS всё равно откроет в Safari: Universal Links
      выдаются только собранным приложениям, и обещать иное нельзя.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cord" />
    <title>Cord — пространство для общения</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
