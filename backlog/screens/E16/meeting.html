<!doctype html>
<html lang="ru" data-theme="dark" data-variant="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E16 — встреча, макет направления</title>
    <link rel="stylesheet" href="mock.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="mark" viewBox="0 0 30 30">
          <g fill="currentColor">
            <rect
              x="2"
              y="6"
              width="6"
              height="18"
              rx="3"
              transform="rotate(-15 5 15)"
            />
            <rect
              x="12"
              y="0.5"
              width="6"
              height="29"
              rx="3"
              transform="rotate(-15 15 15)"
            />
            <rect
              x="22"
              y="4"
              width="6"
              height="22"
              rx="3"
              transform="rotate(-15 25 15)"
            />
          </g>
        </symbol>
        <symbol id="i-mic" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
        </symbol>
        <symbol id="i-mic-off" viewBox="0 0 24 24">
          <path
            d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-6 0M5 11a7 7 0 0 0 11 5.7M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"
          />
        </symbol>
        <symbol id="i-cam" viewBox="0 0 24 24">
          <rect x="3" y="6" width="13" height="12" rx="3" />
          <path d="m16 10 5-3v10l-5-3" />
        </symbol>
        <symbol id="i-screen" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="12" rx="2.5" />
          <path d="M8 20h8M12 16v4" />
        </symbol>
        <symbol id="i-game" viewBox="0 0 24 24">
          <path
            d="M7 7h10a5 5 0 0 1 5 5v1a4 4 0 0 1-7 2.6L13 14h-2l-2 1.6A4 4 0 0 1 2 13v-1a5 5 0 0 1 5-5ZM7 10v3M5.5 11.5h3M16 10.5h.01M18.5 12.5h.01"
          />
        </symbol>
        <symbol id="i-puzzle" viewBox="0 0 24 24">
          <path
            d="M10 4a2 2 0 1 1 4 0v1h3a1 1 0 0 1 1 1v3h1a2 2 0 1 1 0 4h-1v3a1 1 0 0 1-1 1h-3v1a2 2 0 1 1-4 0v-1H7a1 1 0 0 1-1-1v-3H5a2 2 0 1 1 0-4h1V6a1 1 0 0 1 1-1h3Z"
          />
        </symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="6" cy="12" r="1.2" />
          <circle cx="12" cy="12" r="1.2" />
          <circle cx="18" cy="12" r="1.2" />
        </symbol>
        <symbol id="i-hang" viewBox="0 0 24 24">
          <path
            d="M3 14.5c5.5-5 12.5-5 18 0l-2.5 2.7-3.3-1.7v-2.3a9 9 0 0 0-6.4 0v2.3l-3.3 1.7Z"
          />
        </symbol>
        <symbol id="i-chev" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <symbol id="i-chev-r" viewBox="0 0 24 24">
          <path d="m9 6 6 6-6 6" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-pop" viewBox="0 0 24 24">
          <path
            d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
          />
        </symbol>
        <symbol id="i-full" viewBox="0 0 24 24">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3.5" />
          <path
            d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"
          />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z" />
        </symbol>
        <symbol id="i-gear" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
          />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"
          />
        </symbol>
      </defs>
    </svg>

    <div class="app">
      <div class="titlebar">
        <svg class="mark" style="color: var(--accent-fill)">
          <use href="#mark" />
        </svg>
        <span class="title">Планёрка</span>
        <span class="code">AX7·K2M</span>
        <div class="win"><span>—</span><span>▢</span><span>✕</span></div>
      </div>

      <div class="meeting">
        <nav class="rail" aria-label="Разделы">
          <span class="pip tool"
            ><svg class="icon"><use href="#i-home" /></svg
          ></span>
          <span class="pip me">П</span>
          <span class="pip live">Д</span>
          <span class="pip room">К</span>
          <span class="pip room">И</span>
          <span class="gap"></span>
          <span class="pip tool"
            ><svg class="icon"><use href="#i-gear" /></svg
          ></span>
        </nav>

        <section class="stage media-stage" aria-label="Сцена">
          <div class="tiles">
            <div class="tile screen">
              <span class="live">В эфире</span>
              <span class="quality">1080p · 60</span>
              <div class="fake-window">
                <i></i>
                <div class="doc">
                  <i></i><i></i><i></i><i></i><i></i><i></i>
                </div>
              </div>
              <span class="caption"
                ><svg class="icon"><use href="#i-screen" /></svg> Экран
                Никиты</span
              >
            </div>
            <div class="tile cam speaking">
              <span class="face">Н</span>
              <span class="caption"
                ><svg class="icon"><use href="#i-mic" /></svg> Никита</span
              >
            </div>
            <div class="tile cam two">
              <span class="face">В</span>
              <span class="caption"
                ><svg class="icon muted-mic"><use href="#i-mic-off" /></svg>
                Виталий</span
              >
            </div>
          </div>

          <div class="dock" role="toolbar" aria-label="Пульт встречи">
            <div class="group">
              <button>
                <svg class="icon"><use href="#i-mic" /></svg>
              </button>
              <button class="chev">
                <svg class="icon"><use href="#i-chev" /></svg>
              </button>
              <button class="off">
                <svg class="icon"><use href="#i-cam" /></svg>
              </button>
            </div>
            <div class="group">
              <button class="active">
                <svg class="icon"><use href="#i-screen" /></svg>
              </button>
              <button>
                <svg class="icon"><use href="#i-game" /></svg>
              </button>
              <button>
                <svg class="icon"><use href="#i-puzzle" /></svg>
              </button>
              <button>
                <svg class="icon"><use href="#i-more" /></svg>
              </button>
            </div>
            <div class="group hang">
              <button>
                <svg class="icon"><use href="#i-hang" /></svg>
              </button>
            </div>
            <div class="side">
              <button>
                <svg class="icon"><use href="#i-pop" /></svg>
              </button>
              <button>
                <svg class="icon"><use href="#i-full" /></svg>
              </button>
            </div>
          </div>
        </section>

        <div
          class="handle hover"
          role="separator"
          aria-orientation="vertical"
          aria-label="Ширина панели"
        ></div>

        <aside class="panel" aria-label="Панель встречи">
          <header>
            <h2>Участники</h2>
            <span class="close"
              ><svg class="icon"><use href="#i-x" /></svg
            ></span>
          </header>
          <div class="tabs">
            <span class="on">Люди</span><span>Чат</span><span>Боты</span>
          </div>
          <div class="people">
            <div class="eyebrow">В этой встрече · 4</div>
            <div class="person me">
              <span class="ava a">П</span>
              <div>
                <div class="name">Полина</div>
                <div class="sub">Это вы</div>
              </div>
              <div class="st">
                <svg class="icon"><use href="#i-mic" /></svg
                ><svg class="icon off"><use href="#i-cam" /></svg>
              </div>
            </div>
            <div class="person">
              <span class="ava talk">Н</span>
              <div>
                <div class="name">Никита</div>
                <div class="sub">Показывает экран</div>
              </div>
              <div class="st">
                <svg class="icon"><use href="#i-mic" /></svg
                ><svg class="icon"><use href="#i-screen" /></svg>
              </div>
            </div>
            <div class="person">
              <span class="ava b">В</span>
              <div>
                <div class="name">Виталий</div>
                <div class="sub">Микрофон выключен</div>
              </div>
              <div class="st">
                <svg class="icon off"><use href="#i-mic-off" /></svg>
              </div>
            </div>
            <div class="person">
              <span class="ava c">М</span>
              <div>
                <div class="name">Мария</div>
                <div class="sub">Подключается…</div>
              </div>
              <div class="st"></div>
            </div>
          </div>
          <footer>
            <button class="btn primary">
              <svg class="icon"><use href="#i-link" /></svg> Пригласить
            </button>
            <button class="btn quiet">Права участников</button>
          </footer>
        </aside>
      </div>
    </div>
  </body>
</html>
