name: Verify streaming system
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.2+10.0.LTS'
          cache: maven
      - name: Require Docker for PostgreSQL tests
        run: docker info > /dev/null
      - run: bash mvnw -B -pl server fmt:check verify
      - name: Require PostgreSQL tests to run
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('server/target/surefire-reports/TEST-dev.mikki.stream.PostgresIntegrationTest.xml').getroot()
          assert int(suite.attrib['tests']) >= 15
          assert int(suite.attrib['skipped']) == 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-test-results
          path: server/target/surefire-reports
          retention-days: 7
  browser:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25.0.2+10.0.LTS'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: .\mvnw.cmd -B -pl server -am package -DskipTests
      - name: Verify contracts and browser scenarios with a managed local stack
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: |
          try {
            .\scripts\start-local.ps1 -JavaHome $env:JAVA_HOME -SkipBuild -SkipWeb
            Push-Location web
            try {
              npm run generate:api
              if ($LASTEXITCODE -ne 0) { throw 'API generation failed' }
              git diff --exit-code -- src/api/generated.ts ../contracts/openapi.json
              if ($LASTEXITCODE -ne 0) { throw 'Generated API contracts differ from the committed files' }
              npm run test:e2e
              if ($LASTEXITCODE -ne 0) { throw 'Browser scenarios failed' }
            } finally {
              Pop-Location
            }
          } finally {
            .\scripts\stop-local.ps1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-test-results
          include-hidden-files: true
          path: |
            web/playwright-report
            web/test-results
            .local/*.png
            .local/logs
          retention-days: 7
  deployment-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
      - run: node scripts/configure.mjs --app=app.example.test --rtc=rtc.example.test --turn=turn.example.test --ip=192.0.2.1
      - run: node --test scripts/configure.test.mjs scripts/edge-config.test.mjs
      - run: python3 scripts/cohost_cutover_test.py
      - run: python3 scripts/publish_windows_release_test.py
      - run: docker compose config --quiet
      # Издателя музыки собирает тот же образ Go, что и рабочий Dockerfile, поэтому версия
      # здесь и в сборке не может разойтись. Отдельный шаг нужен ради тестов: расписание
      # кадров и разбор Ogg — это то, что слышно в комнате, а не то, что видно в логе.
      - name: Verify the music publisher
        run: >
          docker run --rm -v "$PWD/services/publisher":/src -w /src -e GOFLAGS=-mod=mod
          golang:1.26-bookworm@sha256:9fdc884aacc3bec89b20ffc69f4bb369c78210e3e4f600387b5128b12c199f81
          sh -c "gofmt -l . && go vet ./... && go test ./..."
      - run: docker compose build
      # Плеер страниц кинозала: настоящий Chromium на страницах-фикстурах, без сети и в тех же пределах, что
      # у контейнера в compose (только чтение, без привилегий, память и число процессов).
      - name: Verify the page player of the cinema
        run: |
          docker build -f services/sniffer/Dockerfile --target test -t cord-sniffer-test .
          docker run --rm --network none --read-only --tmpfs /tmp --shm-size 1g --memory 1536m \
            --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true cord-sniffer-test
      - name: Verify integrations, bot commands and audio queue
        run: docker compose run --rm --no-deps --entrypoint python -v "$PWD/services/tests:/tests:ro" -e PYTHONPATH=/app:/tests services -m unittest discover -s /tests -v
      # Пакет кинозала и его плеер страниц (`services/sniffer`) держат черту в 110 знаков строже, чем
      # правило `ruff check` по умолчанию, — ему нужен `--extend-select E501`. Образ закреплён по
      # digest: тег `0.13.2` может смениться содержимым, а сборка не должна из-за этого поплыть.
      - name: Verify the cinema package and the page player with ruff
        run: |
          files=$(cd services && printf '%s\n' tests/test_cinema*.py)
          docker run --rm -v "$PWD/services":/s -w /s \
            ghcr.io/astral-sh/ruff:0.13.2@sha256:bc3a48877dafeac6d765670d5abb7cd17288febe7de15b85412e00f3606c82b1 \
            check cord_services/cinema sniffer $files --line-length 110 --extend-select E501
      - name: Validate gateway and L4 modules without obtaining certificates
        run: |
          docker compose run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose run --rm --no-deps edge validate --config /etc/edge.json
      - name: Verify production containers boot with private configuration files
        run: |
          docker compose up -d postgres redis volume-init livekit tusd core services gateway
          node scripts/smoke.mjs
      - name: Stop the verification stack
        if: always()
        run: docker compose down
