name: Android app
# Отладочный APK приложения Cord для телефона (E12, T16): оболочка Capacitor вокруг страницы сервера и
# foreground service разговора. Собирается только когда меняется `mobile/` — веб приложение грузит с
# сервера, поэтому правка интерфейса пересборки APK не требует. Подробности — docs/mobile.md §8.
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Capacitor 8: Gradle 8.14 и AGP 8.13 — на JDK 21 (25-я, как у ядра, этому Gradle не годится).
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      # Адрес сервера — переменная репозитория CORD_SERVER_URL (Settings → Variables), не код: своя установка —
      # свой адрес. Без неё APK не собирается — оболочка без сервера бесполезна.
      - name: Point the shell at this installation's server
        env:
          CORD_SERVER_URL: ${{ vars.CORD_SERVER_URL }}
        run: node scripts/set-server.mjs
        working-directory: mobile
      # Копирует www и capacitor.config.json в проект Android и пишет подключение плагинов Capacitor
      # (эти файлы не хранятся в git, см. mobile/android/.gitignore).
      - run: npx cap sync android
        working-directory: mobile
      # Android SDK на образе ubuntu-24.04 уже есть ($ANDROID_HOME, лицензии приняты); недостающую
      # платформу Gradle докачает сам.
      - name: Build the debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cord-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
