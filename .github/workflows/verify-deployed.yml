name: Verify deployed meet service
on:
  push:
    branches: [deploy/meet-nikg-tech]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-deployed-meet
  cancel-in-progress: true
jobs:
  public-browser:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Exercise public HTTPS and media from an external Windows runner
        env:
          PLAYWRIGHT_BASE_URL: https://meet.nikg.tech
          PLAYWRIGHT_CHANNEL: msedge
        run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-browser-results
          include-hidden-files: true
          path: |
            web/playwright-report
            web/test-results
            .local/*.png
          retention-days: 7
