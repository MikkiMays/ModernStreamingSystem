name: Verify deployed Cord server
# Адрес проверяемой установки — переменная репозитория CORD_SERVER_URL (Settings → Variables), не код:
# у каждого владельца свой сервер. Не задана — проверка пропускается.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-deployed
  cancel-in-progress: true
jobs:
  public-browser:
    if: vars.CORD_SERVER_URL != ''
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Exercise public HTTPS and media from an external Windows runner
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.CORD_SERVER_URL }}
          PLAYWRIGHT_CHANNEL: msedge
        run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        continue-on-error: true
        with:
          name: public-browser-results
          include-hidden-files: true
          path: |
            web/playwright-report
            web/test-results
            .local/*.png
          retention-days: 7
